<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stalker Vodka GPS</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="StalkerGPS.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none">
        <span id="blazor-error-text">An unhandled error has occurred.</span>
        <a href="" class="reload">Reload</a>
    </div>

    <script>
        window.svSetLanguage = (lang, dir, errorText, reloadText) => {
            document.documentElement.lang = lang;
            document.documentElement.dir = dir;
            document.getElementById("blazor-error-text").textContent = errorText;
            document.querySelector("#blazor-error-ui .reload").textContent = reloadText;
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
